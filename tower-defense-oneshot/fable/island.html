<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

/* ------------------------------------------------------------ helpers */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry32(4242), rr=(a,b)=>a+(b-a)*R(), pick=a=>a[Math.floor(R()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v, sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const V3=THREE.Vector3, TAU=Math.PI*2;
function hash2(x,y){const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);}

/* ------------------------------------------------------------ terrain function */
const SIZE=340;
function shoreR(ang){ return 50+9*Math.sin(ang*2+.7)+6*Math.sin(ang*3+2.1)+7*(fbm(Math.cos(ang)*1.6+5,Math.sin(ang)*1.6+5)-.47); }
function height(x,z){
  const r=Math.hypot(x,z), s=1-r/shoreR(Math.atan2(z,x));

    const mx=x+13,mz=z+9, m=Math.exp(-(mx*mx+mz*mz)/(2*12.5*12.5)); h+=m*25*(.65+.7*fbm(x*.08,z*.08));
    h+=(fbm(x*.16,z*.16)-.47)*1.5*Math.min(1,s*5); return h; }
  return -14*(1-Math.exp(s*3))+(fbm(x*.05+40,z*.05)-.47)*3.5*Math.min(1,-s*2);
}
function slopeAt(x,z){ const e=.6; return Math.hypot(height(x+e,z)-height(x-e,z),height(x,z+e)-height(x,z-e))/(2*e); }

/* ------------------------------------------------------------ renderer / scene */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0xbfe2ff,.0016);
const camera=new THREE.PerspectiveCamera(48,16/9,.5,6000); camera.position.set(88,40,96);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,7,0); controls.enableDamping=true; controls.dampingFactor=.06; controls.minDistance=18; controls.maxDistance=260; controls.maxPolarAngle=Math.PI*.488; controls.enablePan=false; controls.autoRotate=true; controls.autoRotateSpeed=.35;
let lastTouch=-1e9; controls.addEventListener('start',()=>{controls.autoRotate=false;}); controls.addEventListener('end',()=>{lastTouch=performance.now();});
const hemi=new THREE.HemisphereLight(0xcfe8ff,0x6b7a4a,1); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,3); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-85,right:85,top:85,bottom:-85,near:10,far:420}); sun.shadow.bias=-.0004; sun.shadow.normalBias=.12; scene.add(sun,sun.target);
const U={time:{value:0}};
const mats={};
const mat=(c,o)=>{const k=c+(o?JSON.stringify(o):'');return mats[k]||(mats[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.9,metalness:0,flatShading:true},o)));};
function mesh(geo,m,x=0,y=0,z=0,parent){ const o=new THREE.Mesh(geo,m); o.position.set(x,y,z); o.castShadow=true; o.receiveShadow=true; if(parent) parent.add(o); return o; }
const box=(w,h,d,c,x,y,z,p)=>mesh(new THREE.BoxGeometry(w,h,d),mat(c),x,y,z,p);
const ico=(r,det,c,x,y,z,p)=>mesh(new THREE.IcosahedronGeometry(r,det),mat(c),x,y,z,p);
const cone=(r,h,s,c,x,y,z,p)=>mesh(new THREE.ConeGeometry(r,h,s),mat(c),x,y,z,p);
const cyl=(rt,rb,h,s,c,x,y,z,p)=>mesh(new THREE.CylinderGeometry(rt,rb,h,s),mat(c),x,y,z,p);

/* ------------------------------------------------------------ sky */
const skyU={uTop:{value:new THREE.Color()},uHor:{value:new THREE.Color()},uSunDir:{value:new V3(0,1,0)},uSunCol:{value:new THREE.Color()},uMoonDir:{value:new V3(0,-1,0)},uNight:{value:0},uTime:U.time};
const sky=new THREE.Mesh(new THREE.SphereGeometry(3000,32,20),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*viewMatrix*vec4(position+cameraPosition,1.); gl_Position.z=gl_Position.w*.9999; }`,
  fragmentShader:`varying vec3 vD; uniform vec3 uTop,uHor,uSunDir,uSunCol,uMoonDir; uniform float uNight,uTime;
    float h3(vec3 p){p=fract(p*.1031);p+=dot(p,p.yzx+33.33);return fract((p.x+p.y)*p.z);}
    void main(){ vec3 d=normalize(vD); float y=d.y; vec3 c=mix(uHor,uTop,pow(clamp(y*1.25,0.,1.),.6)); c=mix(c,uHor*.8,smoothstep(0.,-.3,y));

      c+=uSunCol*(smoothstep(.9994,.9997,s)*14.+pow(s,220.)*.9+pow(s,24.)*.22+pow(s,5.)*.1)*up;
      float m=max(dot(d,uMoonDir),0.); c+=vec3(.82,.88,1.)*(smoothstep(.99925,.9995,m)*2.2+pow(m,400.)*.3+pow(m,30.)*.04)*uNight;
      vec3 sd=d*260.; float hh=h3(floor(sd)); float st=step(.9972,hh)*smoothstep(.5,0.,length(fract(sd)-.5))*(.55+.45*sin(uTime*2.5+hh*90.));
      c+=vec3(st)*uNight*smoothstep(0.,.15,y)*2.2;
      gl_FragColor=vec4(c,1.); }`}));
sky.frustumCulled=false; sky.renderOrder=-10; scene.add(sky);

/* ------------------------------------------------------------ terrain mesh */
const SEA_SAND=new THREE.Color('#d8c690'), DEEPC=new THREE.Color('#4b7480');
{
  const N=230; let g=new THREE.PlaneGeometry(SIZE,SIZE,N,N); g.rotateX(-Math.PI/2);
  const p=g.attributes.position; for(let i=0;i<p.count;i++) p.setY(i,height(p.getX(i),p.getZ(i)));
  g=g.toNonIndexed(); const q=g.attributes.position, col=new Float32Array(q.count*3), c=new THREE.Color(), c2=new THREE.Color();
  const SAND=new THREE.Color('#f0dca6'), WET=new THREE.Color('#c9b27c'), G1=new THREE.Color('#77c24b'), G2=new THREE.Color('#4e9a3a'), G3=new THREE.Color('#3d7f3a'), ROCK=new THREE.Color('#8b8377'), ROCK2=new THREE.Color('#b9b2a4'), DIRT=new THREE.Color('#9b7c52');
  const a=new V3(),b=new V3(),d=new V3(),n=new V3();
  for(let i=0;i<q.count;i+=3){
    a.fromBufferAttribute(q,i); b.fromBufferAttribute(q,i+1); d.fromBufferAttribute(q,i+2);
    const cx=(a.x+b.x+d.x)/3, cy=(a.y+b.y+d.y)/3, cz=(a.z+b.z+d.z)/3; n.subVectors(b,a).cross(d.clone().sub(a)).normalize(); const ny=Math.abs(n.y), nz=vnoise(cx*.12,cz*.12), j=hash2(cx*3.1,cz*2.7);
    if(cy<0) c.copy(SEA_SAND).lerp(DEEPC,sstep(0,11,-cy));
    else if(cy<1.1) c.copy(WET).lerp(SAND,sstep(.05,.5,cy));
    else { c.copy(G1).lerp(G2,sstep(.3,.7,nz)); c.lerp(G3,sstep(9,18,cy)*.8); c2.copy(SAND); c.lerp(c2,1-sstep(1.1,2.1,cy+nz*.5));
      if(cy>2) c.lerp(DIRT,sstep(.74,.6,ny)*.8); c.lerp(ROCK,sstep(.66,.5,ny)); c.lerp(ROCK,sstep(17,22,cy+nz*3)); c.lerp(ROCK2,sstep(24,29,cy+nz*2)); }
    c.multiplyScalar(.93+.14*j);
    for(let k=0;k<3;k++) c.toArray(col,(i+k)*3);
  }
  g.setAttribute('color',new THREE.BufferAttribute(col,3)); g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.95})); m.receiveShadow=true; m.castShadow=true; scene.add(m);
}
// height texture for the water shader
const HT=256, hData=new Uint16Array(HT*HT*4);
for(let j=0;j<HT;j++) for(let i=0;i<HT;i++){ const h=height((i/(HT-1)-.5)*SIZE,(j/(HT-1)-.5)*SIZE); hData[(j*HT+i)*4]=THREE.DataUtils.toHalfFloat(h); hData[(j*HT+i)*4+3]=THREE.DataUtils.toHalfFloat(1); }
const hTex=new THREE.DataTexture(hData,HT,HT,THREE.RGBAFormat,THREE.HalfFloatType); hTex.magFilter=hTex.minFilter=THREE.LinearFilter; hTex.needsUpdate=true;

/* ------------------------------------------------------------ water */
const waterU={uTime:U.time,uH:{value:hTex},uSize:{value:SIZE},uSunDir:skyU.uSunDir,uSunCol:{value:new THREE.Color()},uTop:skyU.uTop,uHor:skyU.uHor,uShallow:{value:new THREE.Color()},uDeep:{value:new THREE.Color()},uFoam:{value:1}};
{
  const g=new THREE.PlaneGeometry(7000,7000,1,1); g.rotateX(-Math.PI/2);
  const m=new THREE.Mesh(g,new THREE.ShaderMaterial({uniforms:waterU,transparent:true,depthWrite:false,
    vertexShader:`varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
    fragmentShader:`varying vec3 vW; uniform float uTime,uSize,uFoam; uniform sampler2D uH; uniform vec3 uSunDir,uSunCol,uTop,uHor,uShallow,uDeep;
      float h21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
      float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x),f.y);}
      void main(){ vec2 p=vW.xz; float t=uTime; float h=texture2D(uH,clamp(p/uSize+.5,0.,1.)).r; float depth=max(-h,0.);
        vec3 Vv=cameraPosition-vW; float dist=length(Vv); vec3 V=Vv/dist; float lod=clamp(1.-dist/420.,0.,1.); float lod2=clamp(1.3-dist/500.,0.,1.);
        vec2 g=vec2(0.); vec2 d1=vec2(.8,.6),d2=vec2(-.5,.86),d3=vec2(.2,-.98),d4=vec2(-.9,-.3);
        g+=d1*.055*cos(dot(d1,p)*.22+t*.9)*lod2; g+=d2*.05*cos(dot(d2,p)*.37+t*1.2)*lod2; g+=d3*.045*cos(dot(d3,p)*.71+t*1.7)*lod; g+=d4*.04*cos(dot(d4,p)*1.3+t*2.3)*lod;
        g+=(vec2(vn(p*.9+vec2(t*.35,0.)),vn(p*.9+vec2(7.,-t*.3)))-.5)*.2*lod; g+=(vec2(vn(p*3.1-t*.5),vn(p*3.1+13.+t*.45))-.5)*.16*lod*lod;
        vec3 n=normalize(vec3(-g.x,1.,-g.y)); float ndv=max(dot(n,V),0.); float F=.03+.97*pow(1.-ndv,5.);
        vec3 Rr=reflect(-V,n); Rr.y=abs(Rr.y); vec3 skyc=mix(uHor,uTop,pow(clamp(Rr.y,0.,1.),.45));
        vec3 base=mix(uShallow,uDeep,smoothstep(0.,8.5,depth)); base+=uShallow*.25*pow(vn(p*1.6+g*9.+t*.3),3.)*smoothstep(4.,.3,depth);
        float sp=max(dot(Rr,uSunDir),0.); vec3 spec=uSunCol*(pow(sp,420.)*9.+pow(sp,40.)*.22);
        float wob=vn(p*.35+t*.05)*5.; float band=sin(depth*4.2-t*1.5+wob); float foam=smoothstep(.45,.9,band)*smoothstep(2.2,.25,depth)*step(.001,depth);
        foam=max(foam,smoothstep(.32,.04,depth)*step(.001,depth)); foam*=smoothstep(.25,.6,vn(p*2.2+vec2(t*.25,-t*.2))+.25);
        vec3 col=mix(base,skyc,F*.85)+spec; col=mix(col,vec3(uFoam),foam*.92);
        float a=mix(.36,.93,smoothstep(0.,9.,depth)); a=max(a,foam); a=mix(a,1.,F*.7);
        float fg=smoothstep(350.,2200.,dist); col=mix(col,uHor,fg); a=mix(a,1.,fg);
        gl_FragColor=vec4(col,a); }`}));
  m.renderOrder=2; m.frustumCulled=false; scene.add(m);
}
function waveY(x,z,t){ return .16*Math.sin((.8*x+.6*z)*.22+t*.9)+.1*Math.sin((-.5*x+.86*z)*.37+t*1.2); }

/* ------------------------------------------------------------ vegetation (instanced, with wind) */
function colored(geo,color,m){ if(geo.index) geo=geo.toNonIndexed(); if(m) geo.applyMatrix4(m); const c=new THREE.Color(color), n=geo.attributes.position.count, a=new Float32Array(n*3); for(let i=0;i<n;i++) c.toArray(a,i*3); geo.setAttribute('color',new THREE.BufferAttribute(a,3)); geo.deleteAttribute('uv'); return geo; }
const _e=new THREE.Euler(), _q=new THREE.Quaternion(), _s=new V3(), _p=new V3();
const TM=(x,y,z,rx=0,ry=0,rz=0,sx=1,sy=sx,sz=sx)=>new THREE.Matrix4().compose(new V3(x,y,z),new THREE.Quaternion().setFromEuler(new THREE.Euler(rx,ry,rz)),new V3(sx,sy,sz));
function windMat(sway,opt){ const m=new THREE.MeshStandardMaterial(Object.assign({vertexColors:true,flatShading:true,roughness:.9},opt));
  m.onBeforeCompile=sh=>{ sh.uniforms.uTime=U.time; sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',`#include <begin_vertex>
    #ifdef USE_INSTANCING
    float wph=instanceMatrix[3].x*.31+instanceMatrix[3].z*.23;
    #else
    float wph=0.;
    #endif
    float wsw=sin(uTime*1.25+wph)*.6+sin(uTime*2.3+wph*1.7)*.3; float wy=max(transformed.y,0.);
    transformed.x+=wsw*${sway.toFixed(4)}*wy*wy; transformed.z+=cos(uTime*1.05+wph)*${(sway*.6).toFixed(4)}*wy*wy;`); };
  return m; }
// palm
const palmGeo=(()=>{ const parts=[], H=6.6, n=7; let px=0,py=0;
  for(let i=0;i<n;i++){ const t0=i/n,t1=(i+1)/n, x0=1.5*t0*t0,x1=1.5*t1*t1, y0=H*t0,y1=H*t1, ang=Math.atan2(x1-x0,y1-y0), len=Math.hypot(x1-x0,y1-y0);
    parts.push(colored(new THREE.CylinderGeometry(.2-.012*i,.24-.012*i,len*1.08,6),i%2?'#a98758':'#b8966a',TM((x0+x1)/2,(y0+y1)/2,0,0,0,-ang))); px=x1; py=y1; }
  for(let i=0;i<9;i++){ const g=new THREE.PlaneGeometry(1.25,1,2,6), p=g.attributes.position, L=3.6+((i*7)%3)*.35;
    for(let k=0;k<p.count;k++){ const l=p.getY(k)+.5, x=p.getX(k)*(1-l*.88)*(.45+Math.sin(l*3.14)*.75); p.setXYZ(k,x,.5*l-1.5*l*l-Math.abs(x)*.45,L*l); }
    g.computeVertexNormals(); parts.push(colored(g,i%2?'#3f9a3f':'#56b34a',TM(px,py,0,-.25+((i*5)%4)*.1,i/9*TAU+.3,0))); }
  for(let i=0;i<3;i++) parts.push(colored(new THREE.IcosahedronGeometry(.2,0),'#6b4a2a',TM(px+Math.cos(i*2.1)*.25,py-.25,Math.sin(i*2.1)*.25)));
  return mergeGeometries(parts); })();
const pineGeo=(()=>{ const parts=[colored(new THREE.CylinderGeometry(.16,.24,1.8,6),'#7a5636',TM(0,.9,0))];
  for(let i=0;i<4;i++) parts.push(colored(new THREE.ConeGeometry(1.55-i*.32,2.1,7),['#2f7d4a','#2a7040','#35874f','#2f7d4a'][i],TM(0,2.2+i*1.25,0,0,i*.6,0)));
  return mergeGeometries(parts); })();
const roundGeo=(()=>{ const parts=[colored(new THREE.CylinderGeometry(.16,.26,2.4,6),'#80593a',TM(0,1.2,0))];
  [[0,3.5,0,1.55,'#5fb24a'],[.95,2.9,.3,1.1,'#4fa043'],[-.85,3.05,-.4,1.05,'#6cbc52'],[.1,2.8,-.95,.95,'#4a9a40'],[-.2,2.9,.9,.9,'#62b54c']].forEach(([x,y,z,r,c])=>parts.push(colored(new THREE.IcosahedronGeometry(r,1),c,TM(x,y,z,x,y,z))));
  return mergeGeometries(parts); })();
const bushGeo=mergeGeometries([colored(new THREE.IcosahedronGeometry(.6,1),'#4f9f46',TM(0,.4,0)),colored(new THREE.IcosahedronGeometry(.45,1),'#63b450',TM(.45,.32,.2)),colored(new THREE.IcosahedronGeometry(.4,0),'#458f3e',TM(-.4,.3,-.2))]);
const rockGeo=colored(new THREE.IcosahedronGeometry(1,0),'#8f8a80');
const flowerGeo=mergeGeometries([colored(new THREE.IcosahedronGeometry(.13,0),'#ffffff',TM(0,.34,0)),colored(new THREE.CylinderGeometry(.02,.02,.3,4),'#9fe07a',TM(0,.15,0))]);

const KEEP=[], treeTops=[];
function placeSet(geo,material,count,test,scaleR,topH,tints){
  const im=new THREE.InstancedMesh(geo,material,count), M=new THREE.Matrix4(), c=new THREE.Color(); let n=0, tries=0;

  cone(.2,.6,5,'#5f86a6',0,0,1.4,g).rotation.x=Math.PI/2; const fin=cone(.2,.55,4,'#4f7493',0,.48,-.1,g); fin.rotation.x=-.5; fin.scale.x=.3; const tail=box(.9,.06,.4,'#4f7493',0,0,-1.35,g);
  for(const s of [-1,1]){ const fl=box(.5,.05,.25,'#4f7493',s*.4,-.2,.45,g); fl.rotation.z=-s*.6; }
  scene.add(g); dolphins.push({g,tail,th:i*.22+R()*.1+(i>1?2.6:0),k:rr(1.55,1.75),off:i*.9+(i>1?3:0),wasUp:false}); }
const sail=new THREE.Group();
{ box(1.6,.7,5,'#f4f1ea',0,.2,0,sail); box(1.2,.7,1.2,'#f4f1ea',0,.2,2.9,sail).rotation.y=.785; box(1.62,.14,5.02,'#2f6ea8',0,.5,0,sail); cyl(.07,.07,7,6,'#6b4a2e',0,3.9,.4,sail);
  const tri=(pts,c)=>{ const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3)); g.computeVertexNormals(); const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:c,side:THREE.DoubleSide,flatShading:true,roughness:.8})); m.castShadow=true; sail.add(m); };
  tri([0,7.2,.4, 0,1.1,.4, .5,1.1,-2.6],'#ffffff'); tri([0,6.6,.5, 0,1.2,.5, -.35,1.2,2.8],'#ffe9c2'); sail.scale.setScalar(1.5); scene.add(sail); }

/* ------------------------------------------------------------ particles: splashes, smoke, fireflies */
const drops=[]; const dropGeo=new THREE.IcosahedronGeometry(.14,0), dropMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,flatShading:true});
for(let i=0;i<70;i++){ const m=new THREE.Mesh(dropGeo,dropMat); m.visible=false; scene.add(m); drops.push({m,v:new V3(),life:0}); }
function splash(x,z,n=14){ let k=0; for(const d of drops){ if(d.life>0) continue; d.m.position.set(x+rr(-.4,.4),.1,z+rr(-.4,.4)); d.v.set((Math.random()-.5)*4,3+Math.random()*4.5,(Math.random()-.5)*4); d.life=1; d.m.visible=true; if(++k>=n) break; } }
const smoke=[]; for(let i=0;i<22;i++){ const m=new THREE.Mesh(new THREE.IcosahedronGeometry(.35,1),new THREE.MeshBasicMaterial({color:0xcfd3da,transparent:true,opacity:0,depthWrite:false})); scene.add(m); smoke.push({m,t:i/22}); }
const NFF=90, ffPos=new Float32Array(NFF*3), ffBase=[]; for(let i=0;i<NFF;i++){ const p=pick(treeTops); ffBase.push({x:p.x+rr(-5,5),z:p.z+rr(-5,5),ph:R()*6}); }
const ffGeo=new THREE.BufferGeometry(); ffGeo.setAttribute('position',new THREE.BufferAttribute(ffPos,3));
const ffMat=new THREE.PointsMaterial({color:new THREE.Color(2.2,2.6,.7),size:.42,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}); const ff=new THREE.Points(ffGeo,ffMat); ff.frustumCulled=false; scene.add(ff);
function updateParticles(dt,t,night){

  fire.flames.forEach((f,i)=>{ f.scale.set(1+Math.sin(t*13+i*2)*.18,1+Math.sin(t*17+i)*.25,1+Math.cos(t*11+i)*.18); f.rotation.y=t*2*(i%2?1:-1); });
  fire.light.intensity=(18+night*85)*(1+Math.sin(t*15)*.12+Math.sin(t*27)*.08);
  for(let i=0;i<NFF;i++){ const b=ffBase[i], x=b.x+Math.sin(t*.4+b.ph)*3+Math.sin(t*1.3+b.ph*2), z=b.z+Math.cos(t*.33+b.ph*1.3)*3; ffPos[i*3]=x; ffPos[i*3+1]=Math.max(height(x,z),0)+1.2+Math.sin(t*.8+b.ph)*.9; ffPos[i*3+2]=z; }
  ffGeo.attributes.position.needsUpdate=true; ffMat.opacity=night*(.75+.25*Math.sin(t*3)); ff.visible=night>.02;
}

/* ------------------------------------------------------------ audio (all synthesised) */
const A={ctx:null,on:true,master:null,day:1,night:0,
  start(){ if(this.ctx) return; const C=window.AudioContext||window.webkitAudioContext; if(!C) return; const c=this.ctx=new C(); this.master=c.createGain(); this.master.gain.value=this.on?.9:0; this.master.connect(c.destination);
    const buf=c.createBuffer(1,c.sampleRate*3,c.sampleRate), d=buf.getChannelData(0); let last=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+.04*w)/1.04; d[i]=w*.35+last*4; } this.noise=buf;
    const layer=(type,freq,q,base,lfoHz,lfoAmt)=>{ const s=c.createBufferSource(); s.buffer=buf; s.loop=true; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q; const g=c.createGain(); g.gain.value=base;
      const l=c.createOscillator(); l.frequency.value=lfoHz; const lg=c.createGain(); lg.gain.value=lfoAmt; l.connect(lg); lg.connect(g.gain); s.connect(f); f.connect(g); g.connect(this.master); s.start(0,Math.random()*2); l.start(); return g; };
    layer('lowpass',420,.4,.2,.105,.14); layer('bandpass',1500,.5,.06,.073,.05); layer('highpass',3800,.3,.012,.105,.011); this.wind=layer('bandpass',320,.9,.05,.047,.03);
    this.timer=setInterval(()=>this.tick(),260); },
  env(g,t,peak,a,dcy){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+dcy); },
  voice(type,pan){ const c=this.ctx, o=c.createOscillator(), g=c.createGain(); o.type=type; g.gain.value=0; let out=g; if(c.createStereoPanner){ const p=c.createStereoPanner(); p.pan.value=pan; g.connect(p); out=p; } out.connect(this.master); o.connect(g); return {o,g}; },
  chirp(){ const c=this.ctx, t0=c.currentTime+.02, pan=Math.random()*1.6-.8, n=2+Math.floor(Math.random()*5), f0=2600+Math.random()*2600, kind=Math.random(), vol=.03+Math.random()*.05;
    for(let i=0;i<n;i++){ const t=t0+i*(.09+Math.random()*.07), v=this.voice('sine',pan), len=.05+Math.random()*.07; v.o.frequency.setValueAtTime(f0*(kind<.5?1:.8+Math.random()*.5),t); v.o.frequency.exponentialRampToValueAtTime(f0*(kind<.33?1.35:kind<.66?.72:1.1),t+len); this.env(v.g,t,vol,.008,len); v.o.start(t); v.o.stop(t+len+.05); } },
  trill(){ const c=this.ctx, t=c.currentTime+.02, v=this.voice('sine',Math.random()*1.6-.8), l=c.createOscillator(), lg=c.createGain(), f=3200+Math.random()*1500; l.frequency.value=26+Math.random()*14; lg.gain.value=500; l.connect(lg); lg.connect(v.o.frequency); v.o.frequency.value=f; this.env(v.g,t,.035,.03,.5+Math.random()*.4); v.o.start(t); l.start(t); v.o.stop(t+1.1); l.stop(t+1.1); },
  gull(){ const c=this.ctx, t0=c.currentTime+.02, pan=Math.random()*1.6-.8, n=2+Math.floor(Math.random()*3); for(let i=0;i<n;i++){ const t=t0+i*.42, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(); o.type='sawtooth'; f.type='bandpass'; f.frequency.value=1700; f.Q.value=2.5;
      o.frequency.setValueAtTime(720,t); o.frequency.exponentialRampToValueAtTime(1280,t+.07); o.frequency.exponentialRampToValueAtTime(980,t+.22); o.frequency.exponentialRampToValueAtTime(640,t+.36); this.env(g,t,.05*(1-i*.15),.03,.33);
      let out=g; if(c.createStereoPanner){ const p=c.createStereoPanner(); p.pan.value=pan; g.connect(p); out=p; } o.connect(f); f.connect(g); out.connect(this.master); o.start(t); o.stop(t+.45); } },
  baa(){ const c=this.ctx, t=c.currentTime+.02, o=c.createOscillator(), f=c.createBiquadFilter(), g=c.createGain(), l=c.createOscillator(), lg=c.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(360,t); o.frequency.linearRampToValueAtTime(310,t+.7); f.type='bandpass'; f.frequency.value=1050; f.Q.value=1.6;
    l.frequency.value=9; lg.gain.value=16; l.connect(lg); lg.connect(o.frequency); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.045,t+.08); g.gain.setValueAtTime(.045,t+.5); g.gain.exponentialRampToValueAtTime(.0001,t+.8); o.connect(f); f.connect(g); g.connect(this.master); o.start(t); l.start(t); o.stop(t+.85); l.stop(t+.85); },
  cricket(){ const c=this.ctx, t0=c.currentTime+.02, pan=Math.random()*1.6-.8, f=3900+Math.random()*900; for(let i=0;i<3;i++){ const t=t0+i*.055, v=this.voice('sine',pan); v.o.frequency.value=f; this.env(v.g,t,.022*this.night,.006,.03); v.o.start(t); v.o.stop(t+.06); } },
  owl(){ const c=this.ctx, t0=c.currentTime+.02; [0,.5,.72].forEach((d,i)=>{ const t=t0+d, v=this.voice('sine',.3); v.o.frequency.setValueAtTime(410,t); v.o.frequency.exponentialRampToValueAtTime(350,t+.3); this.env(v.g,t,.05,.05,i?.22:.38); v.o.start(t); v.o.stop(t+.55); }); },
  splash(vol=.14){ if(!this.ctx) return; const c=this.ctx, t=c.currentTime, s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); s.buffer=this.noise; f.type='bandpass'; f.frequency.value=1900; f.Q.value=.7; this.env(g,t,vol,.01,.55); s.connect(f); f.connect(g); g.connect(this.master); s.start(t,Math.random()*2,.7); },

/* ------------------------------------------------------------ time of day */
const KEYS=[[0,'#2b4a86','#ffa06c','#ffb27c',1.3,.5],[.07,'#3a7cd4','#ffd9b4','#ffdcae',2.4,.85],[.14,'#2c74d6','#a9d8ff','#fff0d8',3,1.05],[.25,'#2470d6','#9bd2ff','#fff4e2',3.3,1.15],[.43,'#3d76c8','#ffd7a0','#ffd08c',2.5,.9],[.5,'#36448a','#ff8050','#ff8c52',1.3,.5],[.57,'#131c44','#5c406c','#9a8ab8',.5,.3],[.75,'#040817','#0e1c3e','#9fbaff',.6,.26],[.93,'#131c44','#6c4a70','#9a8ab8',.5,.3],[1,'#2b4a86','#ffa06c','#ffb27c',1.3,.5]]
  .map(k=>[k[0],new THREE.Color(k[1]),new THREE.Color(k[2]),new THREE.Color(k[3]),k[4],k[5]]);
const cTop=new THREE.Color(), cHor=new THREE.Color(), cSun=new THREE.Color(), tmpC=new THREE.Color(), SHALLOW=new THREE.Color('#38d3c6'), DEEP=new THREE.Color('#0d4f8a');
let tod=.12, auto=true, night=0; const DAY_LEN=300;
function applyTime(){
  const t=((tod%1)+1)%1; let i=0; while(KEYS[i+1][0]<t) i++; const a=KEYS[i], b=KEYS[i+1], u=(t-a[0])/(b[0]-a[0]);
  cTop.lerpColors(a[1],b[1],u); cHor.lerpColors(a[2],b[2],u); cSun.lerpColors(a[3],b[3],u); const sInt=lerp(a[4],b[4],u), hInt=lerp(a[5],b[5],u);
  const ang=t*TAU, sd=skyU.uSunDir.value.set(Math.cos(ang),Math.sin(ang),.38).normalize(), el=sd.y; skyU.uMoonDir.value.set(-sd.x,-sd.y,-sd.z*.4).normalize();
  night=sstep(.04,-.2,el); const day=sstep(-.12,.2,el); skyU.uNight.value=night; skyU.uTop.value.copy(cTop); skyU.uHor.value.copy(cHor); skyU.uSunCol.value.copy(cSun);
  const useMoon=el<-.12, ld=useMoon?skyU.uMoonDir.value:sd; sun.position.copy(ld).multiplyScalar(220); sun.target.position.set(0,0,0); sun.color.copy(cSun); sun.intensity=sInt*sstep(0,.1,Math.abs(el+.12));
  hemi.intensity=hInt; hemi.color.copy(cTop).lerp(cHor,.55); hemi.groundColor.set('#6b7a4a').lerp(cHor,.3);
  scene.fog.color.copy(cHor); const lum=lerp(.1,1,day);
  waterU.uSunCol.value.copy(cSun).multiplyScalar(useMoon?.35:sstep(-.05,.1,el)); waterU.uShallow.value.copy(SHALLOW).multiplyScalar(lum).lerp(cHor,.12); waterU.uDeep.value.copy(DEEP).multiplyScalar(lum*.9).lerp(cTop,.15); waterU.uFoam.value=lerp(.16,1.05,day);
  cloudMat.emissive.copy(cHor).lerp(cTop,.3); cloudMat.emissiveIntensity=lerp(.5,.32,day); cloudMat.color.setScalar(lerp(.35,1,day));
  for(const m of glowMats) m.emissiveIntensity=night*3.2; lampMat.color.setRGB(1,.9,.6).multiplyScalar(.6+night*4); beam.userData.m.uniforms.uA.value=night;
  renderer.toneMappingExposure=lerp(1.15,1,day); A.day=day*(1-night); A.night=night;
  const hh=(t*24+6)%24; document.getElementById('clock').textContent=String(Math.floor(hh)).padStart(2,'0')+':'+String(Math.floor(hh%1*60)).padStart(2,'0');
}

/* ------------------------------------------------------------ post + resize */
const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(4,4,{type:THREE.HalfFloatType,samples:4}));
composer.addPass(new RenderPass(scene,camera)); composer.addPass(new UnrealBloomPass(new THREE.Vector2(960,540),.28,.7,1.0)); composer.addPass(new OutputPass());
let pr=Math.min(window.devicePixelRatio||1,1.5);
function resize(){ const w=innerWidth,h=innerHeight; renderer.setPixelRatio(pr); renderer.setSize(w,h,false); composer.setPixelRatio(pr); composer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

/* ------------------------------------------------------------ UI */
const $=id=>document.getElementById(id), slider=$('time');
$('start').addEventListener('click',()=>{ A.start(); $('start').style.opacity=0; setTimeout(()=>$('start').style.display='none',1700); $('bar').style.opacity=1; });
$('bPlay').onclick=()=>{ auto=!auto; $('bPlay').textContent=auto?'❚❚':'▶'; };
$('bSound').onclick=()=>{ A.start(); A.toggle(); $('bSound').style.opacity=A.on?1:.4; };
slider.oninput=()=>{ tod=+slider.value; applyTime(); };

/* ------------------------------------------------------------ main loop */
let last=performance.now(), time=0, fAcc=0, fN=0, fps=60, slow=0;
function frame(now){
  requestAnimationFrame(frame); const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt; U.time.value=time;
  if(auto){ tod=(tod+dt/DAY_LEN)%1; slider.value=tod; } applyTime();
  if(!controls.autoRotate&&now-lastTouch>9000&&lastTouch>0) controls.autoRotate=true; controls.update(); if(camera.position.y<1.2) camera.position.y=1.2;
  updateAnimals(dt,time,night); updateBirds(dt,time,night); updateFish(dt,time); updateParticles(dt,time,night);
  for(const c of clouds){ c.position.x+=c.userData.v*dt; if(c.position.x>460) c.position.x=-460; }
  for(const d of dolphins){ d.th+=dt*.085; const r=shoreR(d.th)*d.k, x=Math.cos(d.th)*r, z=Math.sin(d.th)*r, tau=(time*.95+d.off)%7.5, up=tau<Math.PI;
    const y=up?-.9+3.4*Math.sin(tau):-1.1+.15*Math.sin(time*2+d.off), vy=up?3.4*Math.cos(tau)*.95:0; d.g.position.set(x,y,z); d.g.rotation.set(-Math.atan2(vy,r*.085+3),Math.atan2(-Math.sin(d.th),Math.cos(d.th)),0); d.tail.rotation.x=Math.sin(time*8+d.off)*.4;
    const above=y>0; if(above!==d.wasUp){ splash(x,z,12); if(camera.position.distanceTo(d.g.position)<170) A.splash(.1); d.wasUp=above; } }
  const sa=time*.012+1.2; sail.position.set(Math.cos(sa)*128,waveY(Math.cos(sa)*128,Math.sin(sa)*128,time)*.8-.1,Math.sin(sa)*128); sail.rotation.set(Math.sin(time*.8)*.04,Math.atan2(-Math.sin(sa),Math.cos(sa)),Math.sin(time*.6)*.06+.08);
  boat.position.y=waveY(boat.position.x,boat.position.z,time)*.6+.05; boat.rotation.z=Math.sin(time*.9)*.06; boat.rotation.x=Math.sin(time*.7+1)*.04;
  beam.rotation.y=time*.5;
  composer.render();
  fAcc+=dt; fN++; if(fAcc>1.5){ fps=fN/fAcc; fAcc=0; fN=0; if(time>6&&fps<42&&pr>.75){ if(++slow>=2){ pr=Math.max(.75,pr-.2); resize(); slow=0; } } else slow=0; }
}
applyTime(); requestAnimationFrame(frame);
window.ISLE={ camera, controls, setTime(t){ tod=t; auto=false; slider.value=t; applyTime(); }, get fps(){return fps;}, audio:A, counts:{animals:animals.length,gulls:gulls.length,songbirds:songs.length,fish:NF,dolphins:dolphins.length,treeTops:treeTops.length,clouds:clouds.length} };
