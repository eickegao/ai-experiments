<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ utils */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=mulberry32(90210), rr=(a,b)=>a+(b-a)*R(), pick=a=>a[Math.floor(R()*a.length)];
const V3=THREE.Vector3;
const NEON=[[1,.1,.5],[.05,.8,1],[1,.48,.06],[.62,.22,1],[.12,1,.6],[1,.88,.2],[1,.12,.14],[.2,.45,1]];
const WHITE=[1,.95,.9];

/* ------------------------------------------------------------------ renderer */
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.toneMapping=THREE.NoToneMapping; renderer.autoClear=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(55,16/9,0.3,6000); camera.layers.enable(1);
const mirror=new THREE.PerspectiveCamera();

/* shared uniforms */
const U={ uTime:{value:0}, uFogLow:{value:new V3(0.038,0.02,0.07)}, uFogHigh:{value:new V3(0.006,0.009,0.024)}, uFogDen:{value:0.0034}, uFlash:{value:0} };

const COMMON=/*glsl*/`
uniform float uTime; uniform vec3 uFogLow; uniform vec3 uFogHigh; uniform float uFogDen; uniform float uFlash;
float hash11(float p){p=fract(p*.1031);p*=p+33.33;p*=p+p;return fract(p);}
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+17.;a*=.5;}return s;}
vec3 pal(float t){t=fract(t)*6.;return t<1.?vec3(1.,.1,.5):t<2.?vec3(.05,.8,1.):t<3.?vec3(1.,.48,.06):t<4.?vec3(.62,.22,1.):t<5.?vec3(.12,1.,.6):vec3(1.,.88,.2);}
vec3 neonField(vec3 w){float n=vnoise(w.xz*.013+3.);float m=vnoise(w.xz*.021-11.);vec3 c=mix(vec3(1.,.12,.55),vec3(.05,.7,1.),smoothstep(.3,.7,n));return mix(c,vec3(.65,.25,1.),smoothstep(.5,.8,m)*.7);}
vec3 atmo(vec3 d){vec3 c=mix(uFogLow,uFogHigh,smoothstep(-.08,.55,d.y));return c*(1.+uFlash*2.5);}
float fogAmt(vec3 w){float d=distance(w,cameraPosition);float h=exp(-max(w.y,0.)*.008);float hc=exp(-max(cameraPosition.y,0.)*.008);return 1.-exp(-d*uFogDen*(.3+.7*.5*(h+hc)));}
vec3 applyFog(vec3 c,vec3 w){return mix(c,atmo(normalize(w-cameraPosition)),fogAmt(w));}
float pw(float b,float e){return pow(max(b,0.),e);}
float flick(float seed,float mode){float s=1.;if(mode>.5){float gate=vnoise(vec2(uTime*.6+seed*30.,seed*7.));float on=step(.4,hash11(floor(uTime*24.)+seed*91.));float th=mode>1.5?.25:.6;s=mix(1.,on*.92+.08,smoothstep(th,th+.08,gate));}return s*(.94+.06*sin(uTime*110.+seed*50.));}
`;
function SM(vs,fs,uniforms={},opt={}){ return new THREE.ShaderMaterial(Object.assign({uniforms:Object.assign({},U,uniforms),vertexShader:COMMON+vs,fragmentShader:COMMON+fs},opt)); }
const ADD={blending:THREE.AdditiveBlending,depthWrite:false,transparent:true};
const QUAD=new THREE.PlaneGeometry(1,1);
function instGeo(base,attrs){ const g=new THREE.InstancedBufferGeometry(); g.index=base.index; g.setAttribute('position',base.attributes.position); if(base.attributes.uv) g.setAttribute('uv',base.attributes.uv); if(base.attributes.normal) g.setAttribute('normal',base.attributes.normal);
  for(const k in attrs) g.setAttribute(k,new THREE.InstancedBufferAttribute(attrs[k][0],attrs[k][1])); return g; }
function addMesh(geo,mat,layer=0,order=0){ const m=new THREE.Mesh(geo,mat); m.frustumCulled=false; m.layers.set(layer); m.renderOrder=order; scene.add(m); return m; }

/* ------------------------------------------------------------------ camera path */
const HOLO=new V3(0,46,0);
const curve=new THREE.CatmullRomCurve3([
  [-4,3,330],[-5,2.4,255],[3,3.4,180],[5,7.5,108],[-10,19,64],[-27,38,21],[-28,52,-22],[0,60,-41],[6,40,-92],[5,11,-150],[-3,3.6,-215],[-5,3,-285],[-4,8,-345],
  [-26,34,-402],[-60,72,-398],[-77,96,-300],[-80,122,-150],[-100,150,0],[-85,122,160],[-77,82,300],[-55,46,385],[-20,15,402]
].map(p=>new V3(...p)),true,'centripetal');
const PATH_T=150, pathS=curve.getSpacedPoints(500);
function pathCap(x0,z0,x1,z1,m=6){ let c=1e9; for(const p of pathS) if(p.x>x0-m&&p.x<x1+m&&p.z>z0-m&&p.z<z1+m) c=Math.min(c,p.y-9); return c; }
function nearPath(x,y,z,r){ for(const p of pathS) if((p.x-x)**2+(p.y-y)**2+(p.z-z)**2<r*r) return true; return false; }

/* ------------------------------------------------------------------ collectors */
const SB=[];                                   // static boxes: x,y,z,sx,sy,sz,r,g,b
const sbox=(x,y,z,sx,sy,sz,c,k=1)=>SB.push(x,y,z,sx,sy,sz,c[0]*k,c[1]*k,c[2]*k);
function spriteSet(max){ const aPos=new Float32Array(max*3),aSC=new Float32Array(max*4),aCol=new Float32Array(max*4); const o={aPos,aSC,aCol,n:0,max,
  add(x,y,z,sx,sy,seed,mode,c,k){ if(o.n>=max) return; const i=o.n++; aPos[i*3]=x;aPos[i*3+1]=y;aPos[i*3+2]=z; aSC[i*4]=sx;aSC[i*4+1]=sy;aSC[i*4+2]=seed;aSC[i*4+3]=mode; aCol[i*4]=c[0];aCol[i*4+1]=c[1];aCol[i*4+2]=c[2];aCol[i*4+3]=k; } }; return o; }
function decalSet(max){ const aPos=new Float32Array(max*3),aSc=new Float32Array(max*2),aCol=new Float32Array(max*4); const o={aPos,aSc,aCol,n:0,max,
  add(x,z,sx,sz,c,k){ if(o.n>=max) return; const i=o.n++; aPos[i*3]=x;aPos[i*3+1]=.04;aPos[i*3+2]=z; aSc[i*2]=sx;aSc[i*2+1]=sz; aCol[i*4]=c[0];aCol[i*4+1]=c[1];aCol[i*4+2]=c[2];aCol[i*4+3]=k; } }; return o; }
const SS=spriteSet(9000), DS=spriteSet(4000), SD=decalSet(4000), DD=decalSet(600);
const beams=[];                                // cones: pos, quat, radius, height, color, intensity, power
const signs=[], leds=[], holos=[], steam=[], blds=[], BB=[];
const QY=a=>new THREE.Quaternion().setFromAxisAngle(new V3(0,1,0),a);

/* ------------------------------------------------------------------ city layout */
function addBox(x0,z0,x1,z1,y0,h,seed,wx,lit,trimAmt,trim,shop){ BB.push({cx:(x0+x1)/2,cz:(z0+z1)/2,sx:x1-x0,sz:z1-z0,y0,h,seed,wx,lit,trimAmt,trim,shop}); }
function building(x0,z0,x1,z1,faces,front){
  const dm=Math.min(Math.abs(x0),Math.abs(x1));
  let h=front?rr(38,125):rr(45,165); if(R()<.11&&dm>60) h=rr(200,340); if(R()<.1) h=rr(16,30);
  const cap=pathCap(x0,z0,x1,z1); if(cap<12) return; h=Math.min(h,cap);
  const seed=R()*100, wx=rr(1.25,2.3), lit=rr(.08,.45), trim=pick(NEON), trimAmt=R()<.55?1:0;
  let h1=h, top=h;
  if(h>55&&R()<.75){ h1=h*rr(.5,.8); const ix=(x1-x0)*rr(.08,.22), iz=(z1-z0)*rr(.08,.22); addBox(x0+ix,z0+iz,x1-ix,z1-iz,h1,h-h1,seed+1,wx,lit*rr(.6,1.2),trimAmt,trim,0);
    if(h>110&&R()<.6&&cap>h+40){ const sx=(x1-x0)*.3, sz=(z1-z0)*.3, hh=rr(15,40); addBox((x0+x1)/2-sx/2,(z0+z1)/2-sz/2,(x0+x1)/2+sx/2,(z0+z1)/2+sz/2,h,hh,seed+2,wx,lit*.5,1,trim,0); top=h+hh; } }
  addBox(x0,z0,x1,z1,0,h1,seed,wx,lit,trimAmt,trim,1);
  const b={x0,z0,x1,z1,h:h1,top,faces}; blds.push(b);
  if(top>85&&cap>top+40){ const ah=rr(10,26); sbox((x0+x1)/2,top+ah/2,(z0+z1)/2,.35,ah,.35,[.03,.03,.04]); SS.add((x0+x1)/2,top+ah+.3,(z0+z1)/2,5,5,R(),3,[1,.08,.06],2.2); }
  if(h1<110&&R()<.3) steam.push({x:rr(x0+4,x1-4),y:h1+.5,z:rr(z0+4,z1-4),s:rr(3,5.5),n:9,rate:rr(.05,.09),tint:pick(NEON),k:.38});
}
for(let i=-5;i<5;i++) for(let j=-6;j<6;j++){
  const bx0=i>=0?13+72*i:-(13+72*(-i-1))-56, bz0=82*j+9, plazaB=(i===0||i===-1)&&(j===0||j===-1);
  const nz=plazaB?2:(R()<.45?2:3), zs=[bz0]; for(let b=1;b<nz;b++) zs.push(bz0+64*b/nz+(plazaB?0:rr(-5,5))); zs.push(bz0+64);
  const ar=i===0?0:1, br=j===0?0:1;
  for(let a=0;a<2;a++) for(let b=0;b<nz;b++){
    if(plazaB&&a===ar&&b===br) continue;
    const g=()=>rr(.6,2.6); let x0=bx0+a*28+(a?g():rr(0,.5)), x1=bx0+(a+1)*28-(a?rr(0,.5):g()), z0=zs[b]+(b?g():rr(0,.5)), z1=zs[b+1]-(b===nz-1?rr(0,.5):g());
    const faces=[];
    if(a===0) faces.push({ax:'x',pos:x0,s:-1,a0:z0,a1:z1}); else faces.push({ax:'x',pos:x1,s:1,a0:z0,a1:z1});
    if(b===0) faces.push({ax:'z',pos:z0,s:-1,a0:x0,a1:x1}); if(b===nz-1) faces.push({ax:'z',pos:z1,s:1,a0:x0,a1:x1});
    if(plazaB&&a!==ar&&b===br){ x0=bx0+a*28+(a?.3:0); x1=bx0+(a+1)*28-(a?0:.3); faces.push({ax:'x',pos:a?x0:x1,s:a?-1:1,a0:z0,a1:z1,main:true}); }
    if(plazaB&&a===ar&&b!==br){ faces.push({ax:'z',pos:b?z0:z1,s:b?-1:1,a0:x0,a1:x1,main:true}); }
    for(const f of faces) if(f.ax==='x'&&Math.abs(f.pos)<16) f.main=true;
    building(x0,z0,x1,z1,faces,faces.some(f=>f.main));
  }
}
// distant megatower ring
for(let i=0;i<90;i++){ const a=R()*6.283, d=rr(560,1000), w=rr(40,95), x=Math.cos(a)*d, z=Math.sin(a)*d*1.1, h=rr(150,520), s=R()*100, t=pick(NEON);
  addBox(x-w/2,z-w/2,x+w/2,z+w/2,0,h,s,rr(3,4.5),rr(.15,.5),R()<.6?1:0,t,0);
  if(R()<.5) addBox(x-w/4,z-w/4,x+w/4,z+w/4,h,h*rr(.15,.4),s+1,3.5,.3,1,t,0);
  SS.add(x,h*1.02+6,z,16,16,R(),3,[1,.08,.06],2.5); }

/* signs, LED walls */
function facePoint(f,t,out,y){ const n=f.ax==='x'?[f.s,0]:[0,f.s]; const p=f.ax==='x'?[f.pos,t]:[t,f.pos]; return {x:p[0]+n[0]*out,y,z:p[1]+n[1]*out,nx:n[0],nz:n[1]}; }
function addSign(kind,p,rot,w,h,mode){ const c1=pick(NEON); let c2=pick(NEON); if(R()<.3) c2=WHITE; const seed=R();
  signs.push({kind,idx:Math.floor(R()*16),p,rot,w,h,c1,c2,seed,mode});
  SS.add(p.x,p.y,p.z,Math.max(w,h)*2.6,Math.max(w,h)*2.6,seed,mode,c1,.065); }
const fmode=()=>{const r=R();return r<.8?0:r<.94?1:2;};
for(const b of blds) for(const f of b.faces){
  const len=f.a1-f.a0, main=!!f.main; if(len<8) continue;
  const nb=main?1+Math.floor(R()*3):(R()<.5?1:0);
  for(let k=0;k<nb;k++){ const sq=R()<.25, w=sq?rr(2.4,3.8):rr(1.4,2.5), h=sq?w:w*4, y=rr(5+h/2,Math.max(6+h/2,Math.min(b.h-h/2-2,36)));
    if(y+h/2>b.h) continue; const p=facePoint(f,rr(f.a0+2,f.a1-2),w/2+.35,y); if(nearPath(p.x,p.y,p.z,4)) continue;
    addSign(sq?'S':'V',p,f.ax==='x'?0:Math.PI/2,w,h,fmode()); sbox(p.x-p.nx*(w/2+.15),y,p.z-p.nz*(w/2+.15),f.ax==='x'?.3:.12,.12,f.ax==='x'?.12:.3,[.03,.03,.04]); }
  if(R()<(main?.85:.35)){ const w=Math.min(len-3,rr(6,11)), h=w/4, y=rr(5.3,main?7.5:16); if(y+h<b.h){ const p=facePoint(f,rr(f.a0+w/2+1,f.a1-w/2-1),.2,y); addSign('H',p,f.ax==='x'?f.s*Math.PI/2:(f.s>0?0:Math.PI),w,h,fmode()); } }
  if(main&&R()<.35&&b.h>30){ const w=rr(3,4.5), h=w*4, y=rr(14,b.h-h/2-3); if(y-h/2>9){ const p=facePoint(f,rr(f.a0+3,f.a1-3),.2,y); addSign('V',p,f.ax==='x'?f.s*Math.PI/2:(f.s>0?0:Math.PI),w,h,0); } }
  if(R()<(main?.42:.07)&&b.h>46&&len>18){ const w=rr(10,Math.min(17,len-4)), h=rr(11,20), y=rr(16+h/2,Math.min(b.h-h/2-3,50)); if(y+h/2<b.h-1){ const p=facePoint(f,rr(f.a0+w/2+1,f.a1-w/2-1),.25,y);
    leds.push({p,rot:f.ax==='x'?f.s*Math.PI/2:(f.s>0?0:Math.PI),w,h,type:Math.floor(R()*6),seed:R()*10,c1:pick(NEON),c2:pick(NEON)}); SS.add(p.x+p.nx*3,p.y,p.z+p.nz*3,w*2.6,h*2.6,R(),0,pick(NEON),.05); } }
  if(main&&R()<.3){ const w=Math.min(len-2,rr(13,22)), h=w/4, p=facePoint(f,(f.a0+f.a1)/2,-.5,b.h+h/2+1.2); if(!nearPath(p.x,p.y,p.z,12)){ addSign('H',p,f.ax==='x'?f.s*Math.PI/2:(f.s>0?0:Math.PI),w,h,fmode()); sbox(p.x,b.h+.6,p.z,f.ax==='x'?.3:w*.8,1.2,f.ax==='x'?w*.8:.3,[.03,.03,.04]); } }
}
/* free-standing holograms */
function addHolo(x,y,z,rot,w,h,type){ const c1=pick(NEON), c2=pick(NEON); holos.push({p:{x,y,z},rot,w,h,type,seed:R()*10,c1,c2});
  sbox(x,.3,z,1.4,.6,1.4,[.05,.05,.07]); sbox(x,.62,z,1,.08,1,c1,2.5);
  beams.push({x,y:.6,z,up:true,r:w*.5,h:y-h/2-.4,c:c1,k:.5,p:.6}); SS.add(x,y,z,w*2.4,h*2.2,R(),4,c1,.1); SD.add(x,z,w*3,w*3,c1,.12); }
for(let j=-5;j<=5;j++){ if(j===0) continue; const s=(j&1)?1:-1; addHolo(s*10.6,11,82*j+rr(-4,4),0,5.5,8.5,Math.floor(R()*6)); if(R()<.6) addHolo(-s*10.8,10,82*j+rr(-5,5),0,4.5,7,Math.floor(R()*6)); }
[[27,27],[-27,27],[27,-27],[-27,-27]].forEach(([x,z],i)=>addHolo(x,16,z,Math.atan2(x,z),11,17,[1,3,0,5][i]));

/* street furniture */
const LAMP=[1,.86,.62], LAMPC=[.6,.9,1];
for(let z=-470;z<=470;z+=27){ const cz=Math.abs(z-82*Math.round(z/82)); if(cz<10) continue;
  for(const s of [-1,1]){ const c=R()<.25?LAMPC:LAMP, x=s*8.8, hx=s*7.0;
    sbox(x,4.3,z,.22,8.6,.22,[.03,.03,.04]); sbox(s*7.9,8.5,z,2,.14,.14,[.03,.03,.04]); sbox(hx,8.4,z,1.3,.12,.45,c,3.2);
    beams.push({x:hx,y:8.36,z,up:false,r:5.2,h:8.3,c,k:.05,p:1.4,rain:1}); SD.add(hx,z,15,15,c,.075); SS.add(hx,8.3,z,3.4,3.4,R(),0,c,.4); } }
// lights along side avenues and cross streets (seen from the air)
for(let k=0;k<4;k++) for(const s of [-1,1]) for(let z=-470;z<=470;z+=31) for(const e of [-1,1]){ const x=s*(77+72*k)+e*5.6, c=R()<.3?LAMPC:LAMP; SS.add(x,7.5,z,2.6,2.6,R(),0,c,.6); SD.add(x,z,13,13,c,.1); sbox(x+e*.6,3.8,z,.2,7.6,.2,[.03,.03,.04]); }
for(let j=-5;j<=5;j++) for(let x=-340;x<=340;x+=29){ if(Math.abs(x)<16||j===0&&Math.abs(x)<44) continue; const kx=Math.abs(Math.abs(x)-77-72*Math.max(0,Math.min(3,Math.round((Math.abs(x)-77)/72)))); if(kx<9) continue;
  for(const e of [-1,1]){ const z=82*j+e*6.6, c=R()<.3?LAMPC:LAMP; SS.add(x,7.5,z,2.6,2.6,R(),0,c,.6); SD.add(x,z,13,13,c,.1); sbox(x,3.8,z+e*.6,.2,7.6,.2,[.03,.03,.04]); } }
// wires with lanterns across the main street
for(let z=-450;z<=450;z+=rr(16,30)){ const cz=Math.abs(z-82*Math.round(z/82)); if(cz<12||Math.abs(z)<45) continue; const y=rr(11,15); if(nearPath(0,y,z,7)) continue;
  sbox(0,y,z,26,.05,.05,[.02,.02,.025]); const c=pick([[1,.25,.1],[1,.1,.4],[1,.6,.15],[.2,.8,1]]), n=5+Math.floor(R()*4);
  for(let i=0;i<n;i++){ const x=-10+20*i/(n-1); sbox(x,y-.5,z,.45,.6,.45,c,2.2); SS.add(x,y-.5,z,2.2,2.2,R(),R()<.1?1:0,c,.5); } }
// street vents and manholes
for(let z=-440;z<=440;z+=rr(22,46)){ const s=R()<.5?-1:1, onRoad=R()<.35, x=onRoad?s*rr(1,6):s*rr(8.7,11.5);
  steam.push({x,y:.15,z,s:rr(.8,1.4),n:10,rate:rr(.16,.26),tint:pick(NEON),k:.38}); if(!onRoad) sbox(x,.06,z,1.1,.12,1.1,[.04,.04,.05]); }

/* ------------------------------------------------------------------ sprites + decals */

  `varying vec2 vUv; varying vec3 vC; varying float vCore; void main(){ float r=length(vUv-.5)*2.; float a=max(exp(-r*r*4.5)-.011,0.)+exp(-r*r*60.)*.9*vCore; gl_FragColor=vec4(vC*a,1.); }`,{},ADD);

/* ------------------------------------------------------------------ steam */
{
  let n=0; for(const s of steam) n+=s.n; const aO=new Float32Array(n*4), aR=new Float32Array(n*4), aT=new Float32Array(n*4); let i=0;

  addMesh(instGeo(QUAD,{aO:[aO,4],aR:[aR,4],aT:[aT,4]}),SM(`attribute vec4 aO,aR,aT; varying vec2 vUv; varying vec4 vT; varying vec3 vI;
    void main(){ float life=fract(uTime*aR.w+aR.x); float s=aO.w; vec3 w=aO.xyz+vec3((sin(aR.y*40.+uTime*.6)*.5+1.3*life)*life*2.4*s,life*(5.5+3.*aR.y)*s,(sin(aR.y*23.)+.4*sin(uTime*.5+aR.y*9.))*life*1.4*s);

      vI=vec3(smoothstep(0.,.12,life)*pw(1.-life,1.5)*aT.w*smoothstep(1.,7.,-mv.z)*(1.-fogAmt(w)*.7),aR.y*6.28+life*1.3,aR.y); gl_Position=projectionMatrix*mv; }`,
    `varying vec2 vUv; varying vec4 vT; varying vec3 vI; void main(){ vec2 p=vUv-.5; float cs=cos(vI.y),sn=sin(vI.y); p=mat2(cs,-sn,sn,cs)*p; float r=length(p)*2.; float n=fbm(p*3.5+vI.z*17.+vec2(0.,-uTime*.25));

for(const [y,a,o] of [[1.6,.035,0],[4.5,.03,31],[9,.024,67],[20,.018,113]]){ const g=new THREE.PlaneGeometry(900,1100); g.rotateX(-Math.PI/2); g.translate(0,y,0);

/* ------------------------------------------------------------------ rain + splashes */
{
  const N=18000, aP=new Float32Array(N*3), aS=new Float32Array(N); for(let i=0;i<N;i++){ aP[i*3]=Math.random();aP[i*3+1]=Math.random();aP[i*3+2]=Math.random();aS[i]=Math.random(); }
  addMesh(instGeo(QUAD,{aP:[aP,3],aS:[aS,1]}),SM(`attribute vec3 aP; attribute float aS; uniform vec3 uBox; varying vec2 vUv; varying vec3 vC;

  reflRT.setSize(Math.max(2,Math.round(w*pr*.5)),Math.max(2,Math.round(h*pr*.5))); finalPass.uniforms.uRes.value.set(w*pr,h*pr); camera.aspect=w/h; camera.updateProjectionMatrix(); }

/* ------------------------------------------------------------------ reflection pass */
const _t=new V3(), _u=new V3(), _f=new V3();
function renderReflection(){
  const cp=camera.position; mirror.position.set(cp.x,-cp.y,cp.z); camera.getWorldDirection(_f); _t.copy(cp).add(_f); _t.y=-_t.y;
  _u.set(0,1,0).applyQuaternion(camera.quaternion); _u.y=-_u.y; mirror.up.copy(_u); mirror.lookAt(_t); mirror.updateMatrixWorld();

}

/* ------------------------------------------------------------------ main loop */
let last=performance.now(), time=0, flashT=6+Math.random()*8, flashes=[], fAcc=0, fN=0, fpsNow=60, slow=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,(now-last)/1000); last=now; time+=dt; U.uTime.value=time; finalPass.uniforms.uTime.value=time;
  // lightning

}

setTimeout(()=>{ document.getElementById('fade').style.opacity=0; document.getElementById('hint').style.opacity=.75; },300);
setTimeout(()=>{ document.getElementById('hint').style.opacity=0; },9000);
window.CITY={ camera, controls, renderer, jump(u){ autoT=u*PATH_T; mode='auto'; autoPose(autoT,0,true); }, get fps(){return fpsNow;}, get pr(){return pr;}, get mode(){return mode;},
  get ribN(){return ribN;}, ribPos, ribDir, ribCol, counts:{buildings:BB.length,signs:signs.length,leds:leds.length,holos:holos.length,sprites:SS.n,decals:SD.n,cars:NCAR,flyers:NFLY,people:NPPL,steam:steam.length} };
