<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crystal Keep - 3D Tower Defense</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1620;color:#eef3f8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}
#c.drag{cursor:grabbing}#c.place{cursor:crosshair}
.panel{position:fixed;background:rgba(14,22,34,.82);border:1px solid rgba(255,255,255,.12);border-radius:14px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#top{top:14px;left:50%;transform:translateX(-50%);display:flex;gap:26px;padding:10px 26px;font-size:22px;font-weight:700;align-items:center}
#top .stat{display:flex;align-items:center;gap:9px;min-width:92px}
#top small{font-size:13px;font-weight:600;opacity:.6;letter-spacing:.08em;text-transform:uppercase}
.ico{display:inline-block;width:20px;height:20px;flex:none}
.ico.heart{background:#ff5470;clip-path:path('M10 18 C-6 8 2 -2 10 5 C18 -2 26 8 10 18Z')}
.ico.coin{border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a6,#f5b921 55%,#b77a05)}
.ico.flag{background:#7fd0ff;clip-path:polygon(10% 0,22% 0,22% 8%,95% 30%,22% 55%,22% 100%,10% 100%)}
#ctrl{top:14px;right:16px;display:flex;gap:8px;padding:8px}
button{font:inherit;color:inherit;border:0;cursor:pointer;border-radius:10px;background:rgba(255,255,255,.1);
  padding:8px 14px;font-weight:700;font-size:15px;transition:background .12s,transform .08s}
button:hover{background:rgba(255,255,255,.2)}button:active{transform:scale(.96)}
button:disabled{opacity:.4;cursor:default;transform:none}
#ctrl button{min-width:52px;height:40px}
#ctrl button.on{background:#f5b921;color:#1a1300}
#title{top:14px;left:16px;padding:10px 16px;font-weight:800;letter-spacing:.12em;font-size:15px}
#title span{color:#7fe3ff}
#shop{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px}
.card{position:relative;width:112px;padding:6px 6px 8px;border-radius:11px;background:rgba(255,255,255,.07);text-align:center;cursor:pointer;
  border:2px solid transparent;transition:background .12s,border-color .12s,transform .1s}
.card:hover{background:rgba(255,255,255,.15);transform:translateY(-3px)}
.card.sel{border-color:#f5b921;background:rgba(245,185,33,.16)}
.card.poor{opacity:.45}
.card img{width:76px;height:76px;display:block;margin:0 auto;pointer-events:none}
.card .nm{font-size:14px;font-weight:700}
.card .ct{font-size:14px;font-weight:700;color:#ffd257;display:flex;gap:5px;justify-content:center;align-items:center;margin-top:2px}
.card .ct .ico{width:12px;height:12px}
.card .hk{position:absolute;top:5px;left:7px;font-size:11px;font-weight:700;opacity:.55;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:0 5px}
#tip{display:none;bottom:176px;left:50%;transform:translateX(-50%);padding:12px 16px;width:330px;font-size:13.5px;line-height:1.45;pointer-events:none}
#tip b{font-size:15px}#tip .row{display:flex;justify-content:space-between;opacity:.85}
#wave{bottom:14px;left:16px;padding:12px 14px;width:330px}
#wave h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;margin-bottom:6px}
#wlist{display:flex;flex-wrap:wrap;gap:6px;min-height:50px;margin-bottom:9px}
.wen{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);border-radius:8px;padding:2px 8px 2px 2px;font-weight:700;font-size:14px}
.wen img{width:40px;height:40px}
.wen.boss{background:rgba(255,80,80,.22);outline:1px solid rgba(255,90,90,.6)}
#bWave{width:100%;padding:11px;font-size:16px;background:#2f9e5b}
#bWave:hover{background:#38b96b}#bWave:disabled{background:rgba(255,255,255,.1)}
#sel{display:none;right:16px;top:50%;transform:translateY(-50%);width:270px;padding:14px}
#sel h3{font-size:19px;margin-bottom:2px}#sel .lv{color:#ffd257;font-size:14px;font-weight:700;margin-bottom:8px;letter-spacing:.1em}
#sel .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06)}
#sel .row i{font-style:normal;color:#7dffa0;font-weight:700}
#sel .row span:first-child{opacity:.7}
#sel .btns{display:flex;flex-direction:column;gap:7px;margin-top:11px}
#bUp{background:#2f7fd6}#bUp:hover{background:#3b93f0}#bUp:disabled{background:rgba(255,255,255,.1)}
#bSell{background:#a8433f}#bSell:hover{background:#c9534e}
#sel .note{font-size:12px;opacity:.6;margin-top:8px;line-height:1.4}
#help{bottom:14px;right:16px;padding:10px 14px;font-size:12.5px;line-height:1.6;opacity:.9;max-width:340px}
#help b{color:#ffd257}
#banner{position:fixed;top:17%;left:50%;transform:translate(-50%,-50%);font-size:54px;font-weight:900;letter-spacing:.06em;
  text-shadow:0 4px 24px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .35s;text-align:center;white-space:nowrap}
#banner small{display:block;font-size:22px;font-weight:700;letter-spacing:.1em;opacity:.9}
#banner.show{opacity:1}#banner.boss{color:#ff6b5e}
#toast{position:fixed;bottom:190px;left:50%;transform:translateX(-50%);background:rgba(190,50,50,.92);padding:9px 18px;border-radius:10px;
  font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#vig{position:fixed;inset:0;pointer-events:none;opacity:0;box-shadow:inset 0 0 220px 60px rgba(255,30,30,.75);transition:opacity .5s}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,18,.72);z-index:10}
#overlay.hide{display:none}
#obox{background:rgba(16,26,40,.96);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:38px 48px;text-align:center;max-width:680px;
  box-shadow:0 20px 80px rgba(0,0,0,.6)}
#obox h1{font-size:54px;letter-spacing:.08em;margin-bottom:6px}
#obox h1.win{color:#ffd257}#obox h1.lose{color:#ff6b5e}#obox h1 span{color:#7fe3ff}
#obox p{font-size:16px;line-height:1.6;opacity:.85;margin:10px 0}
#obox .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;text-align:left;font-size:14.5px;margin:18px 0;opacity:.9}
#obox .grid b{color:#ffd257}
#obox .stats{display:flex;gap:30px;justify-content:center;margin:20px 0;font-size:15px}
#obox .stats b{display:block;font-size:30px;color:#fff}
#obox button{font-size:20px;padding:14px 44px;background:#2f9e5b;margin-top:10px}
#obox button:hover{background:#38b96b}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;padding:40px;text-align:center}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div class="panel" id="title">CRYSTAL <span>KEEP</span></div>
<div class="panel" id="top">
  <div class="stat"><i class="ico heart"></i><span id="vLives">20</span></div>
  <div class="stat"><i class="ico coin"></i><span id="vGold">0</span></div>
  <div class="stat"><i class="ico flag"></i><small>Wave</small><span id="vWave">0/25</span></div>
</div>
<div class="panel" id="ctrl">
  <button id="bPause" title="Pause (Space / P)">❚❚</button>
  <button id="bSpeed" title="Game speed (F)">1×</button>
  <button id="bMute" title="Sound (M)">♪</button>
</div>
<div class="panel" id="wave">
  <h4 id="wTitle">Next wave</h4>
  <div id="wlist"></div>
  <button id="bWave">Start Wave</button>
</div>
<div class="panel" id="shop"></div>
<div class="panel" id="tip"></div>
<div class="panel" id="sel">
  <h3 id="selName"></h3><div class="lv" id="selLv"></div>
  <div id="selStats"></div>
  <div class="btns">
    <button id="bTarget"></button>
    <button id="bUp"></button>
    <button id="bSell"></button>
  </div>
  <div class="note" id="selNote"></div>
</div>
<div class="panel" id="help">
  <b>Drag</b> rotate · <b>Right-drag</b> / <b>WASD</b> pan · <b>Wheel</b> zoom<br>
  <b>1-5</b> build · <b>U</b> upgrade · <b>X</b> sell · <b>T</b> targeting<br>
  <b>Space</b> pause · <b>F</b> speed · <b>N</b> next wave · <b>Esc</b> cancel
</div>
<div id="banner"></div>
<div id="toast"></div>
<div id="overlay"><div id="obox"></div></div>
<div id="err">Could not load Three.js from the CDN. Check your internet connection and reload.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
if (!window.THREE) { document.getElementById('err').style.display = 'flex'; document.getElementById('overlay').className = 'hide'; return; }
const $ = id => document.getElementById(id);

/* ============================== DATA ============================== */
const TILE = 2, COLS = 22, ROWS = 14, FLY_H = 3.3;
const START_GOLD = 200, START_LIVES = 20, WAVE_GAP = 12;

const TOWERS = {
  gunner: { name: 'Gunner', hotkey: '1', air: true, ground: true,
    desc: 'Rapid-fire turret. Cheap and reliable against ground and air, but weak against armor.',

  frost: { name: 'Frost', hotkey: '3', air: true, ground: true,

    levels: [ { cost: 90, dmg: 4, rate: 1, range: 5.5, slow: 0.35, dur: 1.6 }, { cost: 75, dmg: 8, rate: 1.1, range: 6, slow: 0.45, dur: 2 }, { cost: 150, dmg: 14, rate: 1.25, range: 6.6, slow: 0.55, dur: 2.4 } ] },
  sniper: { name: 'Sniper', hotkey: '4', air: true, ground: true, pierce: true,

    levels: [ { cost: 160, dmg: 22, rate: 1.4, range: 6.5, chain: 3 }, { cost: 140, dmg: 38, rate: 1.6, range: 7, chain: 4 }, { cost: 270, dmg: 62, rate: 1.8, range: 7.6, chain: 6 } ] },

const TOWER_KEYS = Object.keys(TOWERS);
const TARGET_MODES = ['First', 'Last', 'Strong', 'Close'];

const ENEMIES = {
  grunt:  { name: 'Grunt',     hp: 40,   speed: 3.2,  gold: 5,   armor: 0, lives: 1,  r: 0.5, barY: 2.2, color: 0xd9534f, desc: 'Basic foot soldier.' },
  runner: { name: 'Runner',    hp: 24,   speed: 5.6,  gold: 5,   armor: 0, lives: 1,  r: 0.4, barY: 2.0, color: 0xf2b134, desc: 'Fast but fragile.' },
  tank:   { name: 'Ironclad',  hp: 120,  speed: 2.1,  gold: 12,  armor: 4, lives: 1,  r: 0.7, barY: 2.5, color: 0x8894a8, desc: 'Armored: shrugs off weak hits.' },
  flyer:  { name: 'Wyvern',    hp: 34,   speed: 3.9,  gold: 8,   armor: 0, lives: 1,  r: 0.6, barY: 1.2, color: 0xa56bf0, flying: true, desc: 'Flies straight to the keep. Immune to cannons.' },
  healer: { name: 'Shaman',    hp: 70,   speed: 2.7,  gold: 12,  armor: 0, lives: 1,  r: 0.5, barY: 2.6, color: 0x4fd18b, heals: true, desc: 'Heals nearby enemies.' },
  swarm:  { name: 'Swarmling', hp: 11,   speed: 4.4,  gold: 2,   armor: 0, lives: 1,  r: 0.3, barY: 1.0, color: 0xc2452d, desc: 'Tiny, comes in big numbers.' },
  boss:   { name: 'Warlord',   hp: 650, speed: 1.55, gold: 150, armor: 6, lives: 5, r: 1.3, barY: 2.35, color: 0x6b2fa0, boss: true, desc: 'Massive, armored, resists slow, spawns swarmlings.' },
};

// group: [type, count, interval, startDelay, hpScale]
const WAVES = [
  [['grunt', 8, 1.1, 0]],
  [['grunt', 12, 0.9, 0]],
  [['grunt', 8, 1.0, 0], ['runner', 6, 0.7, 6]],
  [['runner', 10, 0.6, 0], ['grunt', 10, 0.8, 5]],
  [['tank', 5, 1.8, 0], ['grunt', 10, 0.8, 4]],
  [['flyer', 8, 1.0, 0], ['grunt', 10, 0.8, 3]],
  [['swarm', 24, 0.3, 0], ['tank', 6, 1.6, 4]],
  [['grunt', 12, 0.7, 0], ['healer', 3, 2.5, 2], ['runner', 10, 0.5, 9]],
  [['flyer', 12, 0.8, 0], ['tank', 8, 1.5, 2]],
  [['grunt', 12, 0.8, 0], ['boss', 1, 0, 6], ['runner', 8, 0.6, 12]],
  [['swarm', 36, 0.25, 0], ['runner', 12, 0.5, 6]],
  [['tank', 12, 1.3, 0], ['healer', 4, 2.5, 3]],
  [['flyer', 16, 0.6, 0], ['runner', 14, 0.5, 4]],
  [['grunt', 18, 0.6, 0], ['tank', 10, 1.3, 3], ['healer', 5, 2.2, 5]],
  [['boss', 2, 9, 0, 0.6], ['swarm', 30, 0.3, 3]],
  [['runner', 22, 0.4, 0], ['flyer', 14, 0.7, 3]],
  [['tank', 18, 1.1, 0], ['healer', 6, 2.2, 3]],
  [['swarm', 44, 0.22, 0], ['grunt', 18, 0.6, 3], ['flyer', 10, 0.8, 8]],
  [['tank', 14, 1.2, 0], ['runner', 16, 0.5, 4], ['healer', 6, 2, 5], ['flyer', 10, 0.8, 10]],
  [['tank', 12, 1.2, 0], ['boss', 2, 10, 5], ['healer', 4, 3, 8]],
  [['flyer', 24, 0.5, 0], ['runner', 22, 0.4, 3]],
  [['tank', 24, 0.9, 0], ['healer', 8, 2, 3]],
  [['swarm', 56, 0.2, 0], ['grunt', 22, 0.5, 3], ['flyer', 16, 0.6, 8]],
  [['tank', 20, 1.0, 0], ['runner', 22, 0.4, 4], ['healer', 10, 1.8, 5], ['flyer', 16, 0.7, 10]],
  [['tank', 12, 1.2, 0], ['boss', 2, 8, 4], ['healer', 6, 2.5, 6], ['boss', 1, 0, 22, 2.5], ['flyer', 14, 0.7, 24]],
];
const goldMul = w => 1 + 0.02 * (w - 1);
const waveBonus = w => 15 + 3 * w;
const enemyGold = (type, w, hs) => Math.max(1, Math.round(ENEMIES[type].gold * goldMul(w) * (hs > 1 ? 2 : hs < 1 ? 0.6 : 1)));
// Enemy health is normalised per wave: the total "threat" of a wave is tied to the gold a player
// can have earned by then, so difficulty rises smoothly whatever the wave composition is.
const DIFFICULTY = 1.0, THREAT = { grunt: 1, runner: 1.2, tank: 1.25, flyer: 1.5, healer: 1.3, swarm: 0.7, boss: 0.85 };
const WAVE_MUL = [];
{
  let cum = START_GOLD;
  WAVES.forEach((wave, i) => {
    const n = i + 1; let threat = 0, gold = 0;
    for (const [t, c, , , hs] of wave) { threat += ENEMIES[t].hp * c * (hs || 1) * THREAT[t]; gold += c * enemyGold(t, n, hs || 1); }
    const u = i / (WAVES.length - 1), ease = (n === 11 || n === 21) ? 0.85 : 1;
    WAVE_MUL.push((1.5 + 7 * Math.pow(u, 0.8)) * DIFFICULTY * ease * cum / threat);
    cum += gold + waveBonus(n);
  });
}
const hpMul = w => WAVE_MUL[clamp(w, 1, WAVES.length) - 1];

/* ============================== MAP ============================== */
const WP = [[-0.5, 2], [3, 2], [3, 10], [7, 10], [7, 2], [12, 2], [12, 6], [10, 6], [10, 11], [16, 11], [16, 4], [19, 4], [19, 9], [20.4, 9]];
const cx = c => (c - COLS / 2 + 0.5) * TILE, cz = r => (r - ROWS / 2 + 0.5) * TILE;
const grid = [], towerAt = [];           // 0 free, 1 path, 2 blocked
for (let r = 0; r < ROWS; r++) { grid.push(new Array(COLS).fill(0)); towerAt.push(new Array(COLS).fill(null)); }
for (let i = 0; i < WP.length - 1; i++) {
  const [ac, ar] = WP[i], [bc, br] = WP[i + 1], n = Math.ceil(Math.max(Math.abs(bc - ac), Math.abs(br - ar)) * 2);
  for (let k = 0; k <= n; k++) {
    const c = clamp(Math.round(lerp(ac, bc, k / n)), 0, COLS - 1), r = clamp(Math.round(lerp(ar, br, k / n)), 0, ROWS - 1);
    grid[r][c] = 1;
  }
}
grid[8][21] = grid[9][21] = grid[10][21] = grid[8][20] = grid[10][20] = 2; grid[9][20] = 1;   // keep area
const pathPts = WP.map(([c, r]) => ({ x: cx(c), z: cz(r) })), pathCum = [0];
for (let i = 1; i < pathPts.length; i++) pathCum.push(pathCum[i - 1] + Math.hypot(pathPts[i].x - pathPts[i - 1].x, pathPts[i].z - pathPts[i - 1].z));
const PATH_LEN = pathCum[pathCum.length - 1];
const P0 = pathPts[0], P1 = pathPts[pathPts.length - 1], FLY_LEN = Math.hypot(P1.x - P0.x, P1.z - P0.z);
function pointAt(d, out) {
  if (d <= 0) { out.x = P0.x; out.z = P0.z; return out; }
  if (d >= PATH_LEN) { out.x = P1.x; out.z = P1.z; return out; }
  let i = 1; while (pathCum[i] < d) i++;
  const t = (d - pathCum[i - 1]) / (pathCum[i] - pathCum[i - 1]);
  out.x = lerp(pathPts[i - 1].x, pathPts[i].x, t); out.z = lerp(pathPts[i - 1].z, pathPts[i].z, t); return out;
}

/* ============================== STATE ============================== */
const S = { gold: 0, lives: 0, wave: 0, queue: [], waveT: 0, countdown: 0, cleared: true, started: false, over: false, paused: false, speed: 1,
  towers: [], enemies: [], projs: [], kills: 0, earned: 0, time: 0, placing: null, selected: null, headless: false, external: false, leaked: 0 };

/* ============================== RENDERER ============================== */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 16 / 9, 0.5, 400);
{
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256; const g = cv.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#2e6fb5'); gr.addColorStop(0.55, '#8fc7e8'); gr.addColorStop(1, '#d6eef7');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(cv); t.encoding = THREE.sRGBEncoding; scene.background = t;
}
scene.fog = new THREE.Fog(0xbfe2f2, 110, 260);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4d6b4a, 0.72));
const sun = new THREE.DirectionalLight(0xfff0d8, 1.05);
sun.position.set(-26, 42, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -36, right: 36, top: 30, bottom: -30, near: 5, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

/* ---------- geometry / material helpers ---------- */
const geos = {}, mats = {};
const geo = (k, f) => geos[k] || (geos[k] = f());
const G = {
  box: (w, h, d) => geo('b' + w + '_' + h + '_' + d, () => new THREE.BoxGeometry(w, h, d)),
  cyl: (rt, rb, h, s = 12) => geo('c' + rt + '_' + rb + '_' + h + '_' + s, () => new THREE.CylinderGeometry(rt, rb, h, s)),
  sph: (r, ws = 14, hs = 10) => geo('s' + r + '_' + ws + '_' + hs, () => new THREE.SphereGeometry(r, ws, hs)),
  cone: (r, h, s = 10) => geo('n' + r + '_' + h + '_' + s, () => new THREE.ConeGeometry(r, h, s)),
  oct: r => geo('o' + r, () => new THREE.OctahedronGeometry(r)),
  tor: (R, r, s = 24) => geo('t' + R + '_' + r + '_' + s, () => new THREE.TorusGeometry(R, r, 8, s)),
};
function mat(color, opt) { const k = color + (opt ? JSON.stringify(opt) : ''); return mats[k] || (mats[k] = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.75, metalness: 0.05 }, opt))); }
const glow = (color, i = 1) => mat(color, { emissive: color, emissiveIntensity: i, roughness: 0.4 });

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hitV = new THREE.Vector3();
let hoverC = -1, hoverR = -1, mouseIn = false;
function pickCell() {
  ray.setFromCamera(mouse, camera); if (!ray.ray.intersectPlane(groundPlane, hitV)) return false;
  hoverC = Math.floor(hitV.x / TILE + COLS / 2); hoverR = Math.floor(hitV.z / TILE + ROWS / 2);
  return hoverC >= 0 && hoverC < COLS && hoverR >= 0 && hoverR < ROWS;
}
function updatePreview() {
  if (!S.placing || !ghost) return;
  if (!mouseIn || !pickCell()) { ghost.visible = cellMark.visible = false; rangeRing.visible = false; return; }
  const ok = canBuild(hoverC, hoverR), afford = canAfford(TOWERS[S.placing].levels[0].cost), good = ok && afford;
  const x = cx(hoverC), z = cz(hoverR), gm = good ? ghostMatOk : ghostMatBad;
  ghost.visible = true; ghost.position.set(x, 0, z);
  if (ghost.userData.gm !== gm) { ghost.userData.gm = gm; ghost.traverse(o => { if (o.isMesh) o.material = gm; }); }
  cellMark.visible = true; cellMark.position.x = x; cellMark.position.z = z; cellMark.material.color.setHex(good ? 0x7dffa0 : 0xff6b6b);
  showRange(x, z, TOWERS[S.placing].levels[0].range, good ? 0x7dffa0 : 0xff6b6b);
}

/* ---------- camera + input ---------- */
const cam = { tx: 0, tz: 1.5, theta: 0, phi: 0.82, r: 54 };
function applyCamera() {
  const sp = Math.sin(cam.phi), shx = camShake > 0 ? (Math.random() - 0.5) * camShake : 0, shy = camShake > 0 ? (Math.random() - 0.5) * camShake : 0;
  camera.position.set(cam.tx + cam.r * sp * Math.sin(cam.theta) + shx, cam.r * Math.cos(cam.phi) + shy, cam.tz + cam.r * sp * Math.cos(cam.theta));
  camera.lookAt(cam.tx + shx, 0, cam.tz);
}
function panCam(dx, dy) {
  const c = Math.cos(cam.theta), s = Math.sin(cam.theta);
  cam.tx = clamp(cam.tx - dx * c - dy * s, -24, 24); cam.tz = clamp(cam.tz + dx * s - dy * c, -16, 16);
}
let ptr = null;
const setMouse = e => { mouse.x = e.clientX / innerWidth * 2 - 1; mouse.y = -(e.clientY / innerHeight) * 2 + 1; };
canvas.addEventListener('pointerdown', e => { initAudio(); ptr = { x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, btn: e.button, moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  setMouse(e); mouseIn = true; if (!ptr) return;
  const dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly; ptr.lx = e.clientX; ptr.ly = e.clientY;
  if (!ptr.moved && Math.hypot(e.clientX - ptr.x, e.clientY - ptr.y) > 5) { ptr.moved = true; canvas.classList.add('drag'); }
  if (!ptr.moved) return;
  if (ptr.btn === 0) { cam.theta -= dx * 0.005; cam.phi = clamp(cam.phi - dy * 0.004, 0.18, 1.38); }
  else panCam(dx * cam.r * 0.0016, dy * cam.r * 0.0016);
});
canvas.addEventListener('pointerup', e => {
  if (!ptr) return; const p = ptr; ptr = null; canvas.classList.remove('drag'); setMouse(e);
  if (p.moved || !S.started || S.over) return;
  if (p.btn === 2) { if (S.placing) setPlacing(null); else select(null); return; }
  if (p.btn !== 0) return;
  const inside = pickCell();
  if (S.placing) {
    if (!inside) return; const k = S.placing, cost = TOWERS[k].levels[0].cost;
    if (!canBuild(hoverC, hoverR)) { toast(towerAt[hoverR] && towerAt[hoverR][hoverC] ? 'A tower is already here' : "Can't build there"); sfx('deny'); return; }
    if (!canAfford(cost)) { toast('Not enough gold'); sfx('deny'); return; }
    placeTower(k, hoverC, hoverR);
    if (!e.shiftKey || !canAfford(cost)) setPlacing(null);
  } else {
    const t = inside ? towerAt[hoverR][hoverC] : null; select(t === S.selected ? null : t);
  }
});
canvas.addEventListener('pointerleave', () => { mouseIn = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.r = clamp(cam.r * Math.exp(e.deltaY * 0.0012), 16, 95); }, { passive: false });
const keys = {};
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
addEventListener('keydown', e => {
  if (e.repeat && !/^(Key[WASDQE]|Arrow)/.test(e.code)) return; keys[e.code] = true;
  if (e.metaKey || e.ctrlKey) return;
  const k = e.key.toLowerCase();
  if (!S.started) { if (k === 'enter') { initAudio(); newGame(); } return; }
  if (S.over) { if (k === 'enter' && $('bAgain')) { newGame(); } return; }
  if (k >= '1' && k <= '5') { const t = TOWER_KEYS[+k - 1]; setPlacing(S.placing === t ? null : t); }
  else if (k === 'escape') { if (S.placing) setPlacing(null); else select(null); }
  else if (k === ' ' || k === 'p') { e.preventDefault(); togglePause(); }
  else if (k === 'f') toggleSpeed();
  else if (k === 'm') toggleMute();
  else if (k === 'n' || k === 'enter') startNextWave();
  else if (k === 'u') $('bUp').onclick();
  else if (k === 'x' || k === 'delete' || k === 'backspace') $('bSell').onclick();
  else if (k === 't') $('bTarget').onclick();
});
function resize() { const w = innerWidth, h = innerHeight; renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2)); renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);

/* ============================== MAIN LOOP ============================== */
let last = performance.now(), ambT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const rdt = Math.min(0.05, (now - last) / 1000); last = now;
  // camera keys
  const ks = rdt * cam.r * 0.6; let px = 0, py = 0;
  if (keys.KeyA || keys.ArrowLeft) px += ks; if (keys.KeyD || keys.ArrowRight) px -= ks; if (keys.KeyW || keys.ArrowUp) py += ks; if (keys.KeyS || keys.ArrowDown) py -= ks;
  if (px || py) panCam(px, py);
  if (keys.KeyQ) cam.theta -= rdt * 1.5; if (keys.KeyE) cam.theta += rdt * 1.5;
  if (S.started && !S.paused && !S.external) {
    if (!S.over) for (let i = 0; i < S.speed; i++) { update(rdt); if (S.over) break; }
    const fdt = rdt * (S.over ? 1 : S.speed); let w = 0;
    for (let i = 0; i < fx.length; i++) if (fx[i].update(fdt)) fx[w++] = fx[i]; fx.length = w;
  }
  // ambient animation
  ambT += rdt;
  keep.crystal.rotation.y += rdt * 1.2; keep.crystal.position.y = 6.1 + Math.sin(ambT * 2) * 0.15; keep.ring.rotation.x = Math.PI / 2 + Math.sin(ambT) * 0.4; keep.ring.rotation.y += rdt; keep.ring.position.y = keep.crystal.position.y;
  if (keep.shake > 0) { keep.shake = Math.max(0, keep.shake - rdt); keep.group.position.x = cx(21) + 0.1 + Math.sin(ambT * 70) * keep.shake * 0.25; }
  portal.swirl.rotation.x += rdt * 3; portal.disc.material.opacity = 0.6 + Math.sin(ambT * 3) * 0.15;
  if (rangeRing.visible) rrEdge.material.opacity = 0.7 + Math.sin(ambT * 5) * 0.2;
  if (camShake > 0) camShake = Math.max(0, camShake - rdt * 1.5);
  updatePreview(); applyCamera(); refreshHUD();
  renderer.render(scene, camera);
}

/* ============================== BOOT ============================== */
buildWorld(); buildKeep(); buildPortal();
makeThumbs(); buildShop(); resize(); showStart(); refreshWavePanel(); applyCamera();
requestAnimationFrame(frame);
window.TD = { camera, select, setPlacing, S, TOWERS, ENEMIES, WAVES, grid, towerAt, COLS, ROWS, cx, cz, pathPts, PATH_LEN, update, placeTower, upgradeTower, sellTower, startNextWave, newGame, canBuild, hpMul, cam, fx };
})();
</script>
